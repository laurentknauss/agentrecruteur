# CI/CD — AgentRecruteur (miroir du process BullionRadar adapté au monorepo)
#
# Philosophie : security + typecheck + build + audit sur tout push/PR.
# Aucun déploiement automatique (déploiement VPS via rsync + systemd, cf. deploy/README.md).
# La branche main est protégée : PR obligatoire + checks verts requis.

name: CI

on:
  push:
  pull_request:

jobs:
  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/scan-secrets.mjs

  typecheck:
    name: Typecheck (tsgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend run typecheck:fast

  build:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend run build

  audit:
    name: pnpm audit (high)
    runs-on: ubuntu-latest
    # BLOQUANT depuis le 2026-09-10 : la CVE-2025-55182 est restée exploitable 9 mois alors que
    # le correctif existait depuis décembre 2025 — un audit non bloquant ne pouvait pas l'arrêter.
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  snyk:
    name: Snyk (dépendances)
    runs-on: ubuntu-latest
    # Effectif dès que le secret SNYK_TOKEN est configuré sur le repo
    # (Settings → Secrets and variables → Actions). Sans lui, le job est ignoré (pas d'échec).
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan Snyk (high+)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
      - name: Monitoring Snyk (main)
        if: env.SNYK_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --all-projects
