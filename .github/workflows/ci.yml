# CI/CD — AgentRecruteur (miroir du process BullionRadar adapté au monorepo)
#
# Philosophie : security + typecheck + build + audit sur tout push/PR.
# Aucun déploiement automatique (déploiement VPS via rsync + systemd, cf. deploy/README.md).
# La branche main est protégée : PR obligatoire + checks verts requis.

name: CI

on:
  push:
  pull_request:

jobs:
  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/scan-secrets.mjs

  typecheck:
    name: Typecheck (tsgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend run typecheck:fast
      - run: pnpm --filter frontend run typecheck:fast

  build:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend run build

  audit:
    name: pnpm audit (high)
    runs-on: ubuntu-latest
    continue-on-error: true # informatif — ne bloque pas les merges (aligné bullion-radar : gate sécurité = scan secrets bloquant)
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
